{
  "openapi": "3.1.0",
  "info": {
    "title": "UATRE — contrato parcial de API",
    "version": "0.2.0",
    "description": "Contrato parcial de Fase 8. JSON es sintaxis válida de YAML. Convenciones en api-design.md. Acceso y altas públicas iniciales implementados; x-implementation-status distingue rutas ejecutables de contratos planned. Las extensiones x-decision-pendiente identifican aspectos aún abiertos. Los POST implementados exigen Origin configurado y application/json."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "security": [
    {
      "sessionCookie": []
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "operationId": "consultarSaludApi",
        "summary": "Consultar disponibilidad del proceso de API",
        "description": "Implementado. No consulta PostgreSQL ni requiere sesión.",
        "security": [],
        "responses": {
          "200": {
            "description": "La API responde",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "status"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "ok"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/health/db": {
      "get": {
        "operationId": "consultarSaludBaseDatos",
        "summary": "Consultar disponibilidad de PostgreSQL",
        "description": "Implementado. Ejecuta una consulta mínima sin exponer detalles de conexión.",
        "security": [],
        "responses": {
          "200": {
            "description": "PostgreSQL responde",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "status"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "ok"
                    }
                  }
                }
              }
            }
          },
          "503": {
            "description": "PostgreSQL no está disponible",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "status"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "unavailable"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/auth/login": {
      "post": {
        "operationId": "iniciarSesion",
        "summary": "Autenticar empresas y seccionales",
        "description": "Implementado para EMPRESA y SECCIONAL con email y contraseña. No seleccionar rol desde el cliente. El acceso de trabajadores y Google quedan fuera de este MVP; D-35/D-36 siguen abiertas para ese actor.",
        "security": [],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Debe coincidir exactamente con WEB_ORIGINS."
          }
        ],
        "x-decision-pendiente": [
          "D-29",
          "D-30",
          "D-35",
          "D-36"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "identificador",
                  "password"
                ],
                "properties": {
                  "identificador": {
                    "type": "string",
                    "minLength": 1,
                    "format": "email",
                    "description": "Email de una cuenta EMPRESA o SECCIONAL activa."
                  },
                  "password": {
                    "type": "string",
                    "minLength": 1,
                    "writeOnly": true,
                    "description": "Máximo técnico de 72 bytes UTF-8."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Identidad de sesión EMPRESA/SECCIONAL. La cookie usa un identificador opaco aleatorio; el servidor persiste su hash en PostgreSQL y vence en una hora. Las altas públicas no crean sesión automáticamente.",
            "headers": {
              "Set-Cookie": {
                "description": "Cookie uatre_session; HttpOnly, Secure en producción, SameSite=Strict, Path=/api/v1; vence en una hora.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/InvalidJson"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          },
          "503": {
            "$ref": "#/components/responses/Unavailable"
          }
        }
      }
    },
