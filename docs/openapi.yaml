    "/auth/password": {
      "x-implementation-status": "planned",
      "patch": {
        "operationId": "cambiarPassword",
        "summary": "Cambiar contraseña en sesión restringida (primer login)",
        "description": "RN-169; UC-TRABAJADOR-008; UC-UATRE-003, flujo B. Requiere sesión restringida de TRABAJADOR o EMPRESA creada manualmente (primera_vez_login=true). Actualiza hash y primera_vez_login=false; renueva sesión tras éxito.",
        "x-decision-pendiente": [
          "D-29",
          "D-36",
          "A-06"
        ],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Debe coincidir exactamente con WEB_ORIGINS."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "nueva_password",
                  "confirmacion_password"
                ],
                "properties": {
                  "nueva_password": {
                    "type": "string",
                    "minLength": 8,
                    "writeOnly": true,
                    "description": "Mínimo 8 caracteres, al menos una mayúscula, una minúscula, un número y un símbolo. Distinta de la temporal."
                  },
                  "confirmacion_password": {
                    "type": "string",
                    "minLength": 8,
                    "writeOnly": true
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Contraseña actualizada; sesión renovada",
